<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noticer</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 20px;font-family:DM Sans,system-ui,sans-serif;color:#eef3ff;background:linear-gradient(180deg,#09111f,#101a2d)}
    main{width:min(520px,100%)}h1{font-family:Outfit,sans-serif;font-size:clamp(2.6rem,9vw,4.2rem);line-height:.95;margin:0 0 16px}
    p{color:#d5deee;font-size:1.2rem}input,button{font:inherit;width:100%;min-height:56px;padding:14px 16px;border-radius:12px;margin-top:8px}
    input{border:1px solid #3b4a66;background:#0e1628;color:#fff}button{border:0;background:#2f6df6;color:#fff;font-weight:800;cursor:pointer}
    .kicker{letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:#9fb0c9}
  </style>
</head>
<body>
  <main>
    <p class="kicker">Noticer</p>
    <h1>Leave your email.</h1>
    <p>We will follow up. No audit runs on this page.</p>
    <form action="https://formsubmit.co/noticer@dalycreation.com" method="POST">
      <input type="hidden" name="_subject" value="Noticer email" />
      <input type="hidden" name="_captcha" value="false" />
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@company.com" />
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
